[project.theme]
language = "en"
# the icon of the project: a copy of the one in the package (src/xtouch_daemon/gui/qt/theme/images/icon.svg, which the
# GUI uses), made by `just docs-icon` before every build
logo = "images/icon.svg"
favicon = "images/icon.svg"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"


# A version selector in the header: the versions are deployed with mike (Zensical's fork, until Zensical versions
# documentation itself) to the branch gh-pages, `dev` for main and X.Y.Z for each release, the newest one also as
# `latest`.
[project.extra.version]
provider = "mike"
alias = true

[project.plugins.mike]
# an alias (latest) redirects to its version; GitHub Pages doesn't need to follow symlinks
alias_type = "redirect"
canonical_version = "latest"
