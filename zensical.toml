# The documentation site, built with Zensical (https://zensical.org):
#   uv run --group docs zensical serve        # preview on http://localhost:8000
#   uv run --group docs zensical build --clean --strict
# .github/workflows/docs.yml publishes it to GitHub Pages, a version per release (see the [project.extra.version]
# section and CONTRIBUTING.md).

[project]
site_name = "xtouch-daemon"
site_description = "Use a Behringer X-Touch Extender as a hardware mixer for PipeWire"
site_author = "Markus Ressel"
site_url = "https://markusressel.github.io/xtouch-daemon/"
repo_url = "https://github.com/markusressel/xtouch-daemon"
repo_name = "markusressel/xtouch-daemon"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; Markus Ressel, AGPL-3.0-or-later"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Configuration" = [
    "configuration/index.md",
    { "Behavior, device, aliases" = "configuration/behavior.md" },
    { "Channels, states and slots" = "configuration/slots.md" },
    { "Channels" = "configuration/strips.md" },
    { "Devices" = "configuration/devices.md" },
    { "Applications" = "configuration/applications.md" },
    { "Presets" = "configuration/presets.md" },
    { "Encoders" = "configuration/encoders.md" },
    { "LEDs" = "configuration/indicators.md" },
    { "People and the voice chat" = "configuration/people.md" },
  ] },
  { "Home Assistant" = "home-assistant.md" },
  { "Mumble" = "integrations/mumble.md" },
  { "GUI" = "gui.md" },
  { "Commands" = "commands.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Hardware" = "hardware.md" },
  { "Architecture" = "architecture.md" },
  { "Design: layouts" = "design/layouts.md" },
  { "Design: launching applications" = "design/launch.md" },
  { "Design: choices and collapsing strips" = "design/dynamic-strips.md" },
  { "Design: presets" = "design/presets.md" },
  { "Design: channels, states and slots" = "design/channels-states-slots.md" },
  { "Design: a simulated device" = "design/device-simulator.md" },
  { "Design: previews of the controls" = "design/control-previews.md" },
  { "Changelog" = "https://github.com/markusressel/xtouch-daemon/blob/main/CHANGELOG.md" },
]

[project.theme]
language = "en"
# the icon of the project: a copy of the one in the package (src/xtouch_daemon/gui/qt/theme/images/icon.svg, which the
# GUI uses), made by `just docs-icon` before every build
logo = "images/icon.svg"
favicon = "images/icon.svg"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"


# A version selector in the header: the versions are deployed with mike (Zensical's fork, until Zensical versions
# documentation itself) to the branch gh-pages, `dev` for main and X.Y.Z for each release, the newest one also as
# `latest`.
[project.extra.version]
provider = "mike"
alias = true

[project.plugins.mike]
# an alias (latest) redirects to its version; GitHub Pages doesn't need to follow symlinks
alias_type = "redirect"
canonical_version = "latest"
