# The documentation site, built with Zensical (https://zensical.org):
#   uv run --group docs zensical serve        # preview on http://localhost:8000
#   uv run --group docs zensical build --clean --strict
# .github/workflows/docs.yml publishes it to GitHub Pages, a version per release (see the [project.extra.version]
# section and CONTRIBUTING.md).

[project]
site_name = "xtouch-daemon"
site_description = "Use a Behringer X-Touch Extender as a hardware mixer for PipeWire"
site_author = "Markus Ressel"
site_url = "https://markusressel.github.io/xtouch-daemon/"
repo_url = "https://github.com/markusressel/xtouch-daemon"
repo_name = "markusressel/xtouch-daemon"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; Markus Ressel, AGPL-3.0-or-later"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/entities.js"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Install" = "getting-started/install.md" },
    { "First steps" = "getting-started/first-steps.md" },
    { "Setup tour" = "getting-started/tour.md" },
    { "Without a device" = "getting-started/without-a-device.md" },
  ] },
  { "Concepts" = "concepts.md" },
  { "Guides" = [
    { "GUI" = "guides/gui.md" },
    { "Home Assistant" = "guides/home-assistant.md" },
    { "Mumble" = "guides/mumble.md" },
    { "Troubleshooting" = "guides/troubleshooting.md" },
  ] },
  { "Configuration" = [
    "configuration/index.md",
    { "Channels, states and slots" = "configuration/slots.md" },
    { "Channels" = [
      "configuration/channels/index.md",
      { "Devices" = "configuration/channels/devices.md" },
      { "Applications" = "configuration/channels/applications.md" },
      { "People and the voice chat" = "configuration/channels/people.md" },
    ] },
    { "Parts of a strip" = [
      { "Encoders" = "configuration/strip/encoders.md" },
      { "LEDs" = "configuration/strip/leds.md" },
    ] },
    { "Presets" = "configuration/presets.md" },
    { "Behavior, device and aliases" = "configuration/behavior.md" },
  ] },
  { "Reference" = [
    { "Commands" = "reference/commands.md" },
    { "Hardware and protocol" = "reference/hardware.md" },
    { "Voice chat bridge" = "reference/voice-chat-bridge.md" },
  ] },
  { "Development" = [
    "development/index.md",
    { "Architecture" = [
      "development/architecture/index.md",
      { "Audio" = "development/architecture/audio.md" },
      { "Live view" = "development/architecture/live-view.md" },
      { "GUI" = "development/architecture/gui.md" },
      { "Testing" = "development/architecture/testing.md" },
    ] },
    { "Mumble plugin" = "development/mumble-plugin.md" },
    { "Home Assistant controller" = "development/haad-controller.md" },
    { "Design" = [
      { "Channels, states and slots" = [
        "development/design/slots/index.md",
        { "Channels and pools" = "development/design/slots/channels.md" },
        { "States and modes" = "development/design/slots/states.md" },
        { "Slots" = "development/design/slots/slots.md" },
        { "Where the people sit" = "development/design/slots/people.md" },
        { "Pools of your own" = "development/design/slots/pools-of-your-own.md" },
        { "In the daemon" = "development/design/slots/daemon.md" },
      ] },
      { "Previews" = "development/design/previews.md" },
      { "Try changes and situations" = "development/design/try-and-simulate.md" },
      { "The virtual twin" = "development/design/virtual-twin.md" },
      { "A simulated device" = "development/design/device-simulator.md" },
      { "Previews of the controls" = "development/design/control-previews.md" },
      { "Output choices" = "development/design/choices.md" },
      { "Launching applications" = "development/design/launch.md" },
      { "Presets" = "development/design/presets.md" },
      { "The voice chat" = "development/design/voice-chat.md" },
      { "An interactive device test" = "development/design/interactive-test.md" },
    ] },
    { "History" = [
