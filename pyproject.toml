[project]
name = "xtouch-daemon"
version = "0.2.0"
description = "Use a Behringer X-Touch Extender as a hardware mixer for PipeWire: motor faders, meters, scribble strips"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Markus Ressel", email = "mail+github@markusressel.de" }]
requires-python = ">=3.14,<3.15"
keywords = ["x-touch", "behringer", "mackie-control", "pipewire", "pulseaudio", "mixer", "midi", "daemon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "aiomqtt>=2.5",
    "click>=8.1",
    "dbus-fast>=5.2.0",
    "haad-mqtt-autodiscovery",
    "pulsectl-asyncio>=1.2",
    "pydantic>=2.7",
    "websockets>=15",
]

[project.urls]
Homepage = "https://github.com/markusressel/xtouch-daemon"
Issues = "https://github.com/markusressel/xtouch-daemon/issues"

[project.scripts]
xtouch-daemon = "xtouch_daemon.cli:main"

[project.optional-dependencies]
gui = [
    "pyqt6>=6.12.0",
    "qt-themes>=0.4.0",
    "qtawesome>=1.4.2",
    "tomlkit>=0.13",
]

[tool.uv.sources]
# from the checkout next to this one, like haad does (git clone it to ../haad-mqtt-autodiscovery)
haad-mqtt-autodiscovery = { path = "../haad-mqtt-autodiscovery", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-qt>=4.4",
    "xtouch-daemon[gui]",
    "ruff>=0.11",
    "pytest-xdist>=3.8.0",
    "looptime>=0.9",
    "jsonschema>=4.26.0",
]
docs = [
    "zensical>=0.1.1",
    # Zensical's fork of mike: versions of the documentation (until Zensical has that itself)
    "mike @ git+https://github.com/squidfunk/mike.git@2d4ad799442f4592db8ad53b179bfb33db8c69ac",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
qt_api = "pyqt6"
addopts = "--strict-markers --looptime"
markers = ["host: the test looks at the machine it runs on on purpose (see `no_host` in tests/conftest.py)"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["xtouch_daemon"]
branch = true

[tool.coverage.report]
fail_under = 93
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
    "case _ as unreachable:",
    "assert_never\\(",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "PIE", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# tests write their configuration files in place, blocking for a moment is fine there
"tests/**" = ["ASYNC240"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.codespell]
# integrations/mumble/include is Mumble's header, as it is upstream
skip = "*.lock,./site,./.venv,./integrations/mumble/include,./integrations/mumble/build"
# "bu" and "pres" are typed into fields (the starts of "buds" and "present"), HDA is a sound card (HDA Intel),
# hass is Home Assistant (as in its own code)
ignore-words-list = "bu,hda,hass,pres"
