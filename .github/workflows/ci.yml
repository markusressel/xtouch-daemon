name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    defaults:
      run:
        working-directory: xtouch-daemon
    steps:
      - uses: actions/checkout@v4
        with:
          path: xtouch-daemon
      # a path dependency (see [tool.uv.sources]): it is checked out next to the project, at the commit the release
      # builds with
      - name: Read the pinned commit of haad-mqtt-autodiscovery
        id: pin
        run: echo "rev=$(tr -d '[:space:]' < packaging/haad-mqtt-autodiscovery.rev)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: haad-org/haad-mqtt-autodiscovery
          ref: ${{ steps.pin.outputs.rev }}
          path: haad-mqtt-autodiscovery
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: xtouch-daemon/uv.lock
      # the libraries of the Qt in the PyQt6 wheels, for the GUI tests (offscreen)
      - name: Install Qt's system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Spelling
        run: uvx codespell
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing
      - name: Check the packaging scripts
        run: for script in packaging/build-release.sh packaging/aur/publish.sh; do bash -n "$script"; done
