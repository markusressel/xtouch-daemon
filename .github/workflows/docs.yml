# Publishes the documentation a version at a time with mike (Zensical's fork, until Zensical versions documentation
# itself) to the branch gh-pages, which GitHub Pages serves (Settings > Pages > Source: Deploy from a branch,
# gh-pages, / (root)). main is the version "dev"; a tag X.Y.Z is the version X.Y.Z, also as "latest", which the root
# of the site redirects to once a release exists (before that: dev). Each run builds only its own version: the others
# stay as they were built, with the Zensical of their time.
name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'

permissions:
  contents: write

# one deployment at a time: each one commits to gh-pages
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical "mike @ git+https://github.com/squidfunk/mike.git@2d4ad799442f4592db8ad53b179bfb33db8c69ac"
      # the icon of the project for the site, from the package (see `just docs-icon`)
      - run: cp src/xtouch_daemon/gui/quick/images/icon.svg docs/images/icon.svg
      # --strict: a broken link or anchor fails the build (mike builds without it)
      - run: zensical build --clean --strict
      - name: Prepare gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the versions deployed so far; none before the first deployment
          git fetch origin gh-pages --depth=1 || true
      - name: Deploy dev
        if: github.ref_type == 'branch'
        run: |
          mike deploy --push dev
          if ! mike list latest > /dev/null 2>&1; then
            mike set-default --push dev
          fi
      - name: Deploy the release
        if: github.ref_type == 'tag'
        run: |
          mike deploy --push --update-aliases "$GITHUB_REF_NAME" latest
          mike set-default --push latest
      # GitHub Pages has no redirects: its 404 page forwards an address without a version (or of a version not
      # deployed) to the version the root shows (see pages/404.html)
      - name: Forward addresses without a version
        run: |
          git fetch origin gh-pages --depth=1
          git worktree add --detach "$RUNNER_TEMP/pages" origin/gh-pages
          cp pages/404.html "$RUNNER_TEMP/pages/404.html"
          cd "$RUNNER_TEMP/pages"
          git add 404.html
          if ! git diff --cached --quiet; then
            git commit -m "404.html: forward addresses without a version"
            git push origin HEAD:gh-pages
          fi
