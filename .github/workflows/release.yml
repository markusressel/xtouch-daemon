name: Release

# For a tag X.Y.Z: builds the release tarballs with packaging/build-release.sh, test-builds and installs the AUR
# packages from them in an Arch Linux container, and attaches the tarballs to the GitHub release of the tag.
# The AUR packages are published by the maintainer with packaging/aur/publish.sh (see RELEASING.md).
# A pull request that changes the packaging, and a run by hand, do the same for the version in pyproject.toml, without
# the release.

on:
  push:
    tags:
      - '*.*.*'
  pull_request:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the release tarballs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: xtouch-daemon
    steps:
      - uses: actions/checkout@v4
        with:
          path: xtouch-daemon
      - name: Read the pinned commit of haad-mqtt-autodiscovery
        id: pin
        run: echo "rev=$(tr -d '[:space:]' < packaging/haad-mqtt-autodiscovery.rev)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: haad-org/haad-mqtt-autodiscovery
          ref: ${{ steps.pin.outputs.rev }}
          path: haad-mqtt-autodiscovery
      - uses: astral-sh/setup-uv@v6
      - name: The version of the project, which a tag must be
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but pyproject.toml has version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: packaging/build-release.sh dist
      # pulsectl loads libpulse on import; Arch's package depends on it (libpulse)
      - name: Install libpulse
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse0
      - name: Smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          root="$(mktemp -d)"
          tar -xzf "dist/xtouch-daemon-${VERSION}-x86_64.tar.gz" -C "${root}"
          cd /
          "${root}/xtouch-daemon-${VERSION}-x86_64/usr/bin/xtouch-daemon" --version
          "${root}/xtouch-daemon-${VERSION}-x86_64/usr/bin/xtouch-daemon" check-config \
            -c "${root}/xtouch-daemon-${VERSION}-x86_64/usr/share/xtouch-daemon/config.example.toml"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: xtouch-daemon/dist/
          if-no-files-found: error

  aur:
    name: Build and install the AUR packages
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Install the dependencies
        run: pacman -Syu --noconfirm --needed git pacman-contrib libpulse pipewire python python-pyqt6 qt6-base
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Check the publish script
        run: bash -n packaging/aur/publish.sh
      - name: Build the packages from the tarballs of this run
        shell: bash
        run: |
          useradd --create-home builder
          for pkg in xtouch-daemon-bin xtouch-daemon-gui-bin; do
            mkdir -p "/build/${pkg}"
            cp "packaging/aur/${pkg}/PKGBUILD" "/build/${pkg}/"
            sed -i "s/^pkgver=.*/pkgver=${VERSION}/; s/^pkgrel=.*/pkgrel=1/" "/build/${pkg}/PKGBUILD"
          done
          # makepkg takes a source file it finds next to the PKGBUILD instead of downloading it
          cp dist/xtouch-daemon-"${VERSION}"-x86_64.tar.gz /build/xtouch-daemon-bin/
          cp dist/xtouch-daemon-gui-"${VERSION}"-any.tar.gz /build/xtouch-daemon-gui-bin/
          chown -R builder:builder /build
          for pkg in xtouch-daemon-bin xtouch-daemon-gui-bin; do
            su builder -c "cd /build/${pkg} && updpkgsums && makepkg --printsrcinfo > .SRCINFO && makepkg --force --nodeps --noconfirm"
            cat "/build/${pkg}/.SRCINFO"
          done
      - name: Install and run them
        run: |
          pacman -U --noconfirm /build/xtouch-daemon-bin/*.pkg.tar* /build/xtouch-daemon-gui-bin/*.pkg.tar*
          xtouch-daemon --version
          # as a user: the daemon and its checks refuse to run as root
          su builder -c "xtouch-daemon check-config -c /usr/share/xtouch-daemon/config.example.toml"
          test -f /usr/lib/systemd/user/xtouch-daemon.service
          # the GUI's environment: the system's PyQt6 with the daemon's packages
          /usr/lib/xtouch-daemon-gui/bin/python3.14 -I -c 'import PyQt6.QtQuick, qtawesome, tomlkit, xtouch_daemon.gui.quick'

  release:
    name: Attach the tarballs to the GitHub release
    needs: [build, aur]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v version="${GITHUB_REF_NAME}" '
            /^## \[/ { if (found) exit; found = index($0, "## [" version "]") == 1; next }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME}"
            exit 1
          fi
      - name: Create the release, or add to the one of the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "${GITHUB_REF_NAME}" --notes-file notes.md
          fi
