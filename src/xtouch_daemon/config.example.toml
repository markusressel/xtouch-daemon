#:schema https://markusressel.github.io/xtouch-daemon/latest/config.schema.json
# xtouch-daemon configuration: channels, states and slots
#
# `xtouch-daemon check-config` checks it and shows what each slot shows when; apply changes with
# `systemctl --user reload xtouch-daemon`. The docs: Configuration > Channels, states and slots.
#
# A channel is something a strip controls (a device, a group of applications, a person, Home Assistant); a slot is
# a strip of the device, and shows the first of its candidates whose condition holds; a state (in a call, gaming)
# is what those conditions ask about. Slots without candidates show `auto`: the people of the voice chat (from the
# right) and the applications that play (from the left). `people` and `apps` are the two on their own, e.g.
# 6 = ["people", "apps"]: a person, else an application.

[channel.out]
type = "output"             # the default output

[channel.mic]
type = "input"              # the default input

[slots]
7 = "mic"
8 = "out"                   # the main output on the right, as in a DAW; slots 1 to 6 are auto

# [channel.voip]             # the voice chat as one strip
# type = "apps"
# match = ["@voip"]
# label = "VoIP"
#
# [state.call]               # in a call, for slots like 6 = ["voip if call", "auto"]
# voice_chat = true          # Mumble with the plugin; for Discord: recording = ["discord"]
# delay_off = 5
#
# [state.gaming]             # a mode: while a game from Steam runs
# mode = true
# processes = ["@steam-games"]
#
# [pool.people]              # the people of the voice chat
# from = "right"             # the side they fill their slots from; [pool.apps] has one for the applications
# order = ["Alice"]          # who sits first; the others in the order they were first seen
#
# [channel.screen]           # a fader of your own: the brightness of a screen, by programs you run
#                            # (sysctrl: https://github.com/markusressel/system-control)
# type = "custom"
# fader = { set = "sysctrl display redshift brightness -d DisplayPort-1 -b {value}", watch = "sysctrl display redshift brightness -d DisplayPort-1 --watch", min = 0.1, max = 1.0 }
# lcd = { poll = "date +%H:%M", every = 10 }   # the second line: the time, from a run every 10 seconds
#                            # programs run without a shell: a pipe belongs in a script of your own
#
# [homeassistant]            # parts that show and set entities of Home Assistant directly
# url = "http://homeassistant.local:8123"
# token_file = "~/.config/xtouch-daemon/homeassistant-token"   # a long-lived access token (your profile, Security)
#
# [channel.lamp]             # the desk lamp: the fader sets its brightness, the LCD has its color, Select toggles it
# type = "custom"
# fader = { entity = "light.desk" }
# color = { entity = "light.desk" }
# select = { press = { service = "light.toggle", entity = "light.desk" }, led = { entity = "light.desk" } }
