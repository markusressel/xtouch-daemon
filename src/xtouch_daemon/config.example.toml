[[strip]]
type = "output"
label = "Output"
color = "white"

# ---- Home Assistant (for "homeassistant" strips) -------------------------------------------------------------
#
# [mqtt]
# host = "homeassistant.local"
# port = 1883
# username = "xtouch"
# password_file = "~/.config/xtouch-daemon/mqtt-password"   # or password = "...", or password_env = "VAR"
# discovery_prefix = "homeassistant"
# namespace = "xtouch"                # entity IDs start with it: number.xtouch_strip_5_fader
# device_name = "X-Touch Extender"

# ---- Layouts: other sets of strips, see https://markusressel.github.io/xtouch-daemon/configuration/layouts/ -----
#
# The strips above are the layout "default". Switch with `xtouch-daemon layout gaming`, Home Assistant's
# select.xtouch_layout, Solo of strips 1 and 8 held together, or the rules (apps, processes).
#
# [switching]
# hold = 10                           # seconds a layout stays after its rule stopped matching
#
# [voip]
# provider = "demo"                   # "bridge": a plugin of the voice chat client sends the participants
#
# [[layout]]
# name = "gaming"
# label = "Gaming"
# apps = ["steam_app_", ".exe"]       # while a game has a stream
#
# [[layout.strip]]
# type = "apps"
# label = "Game"
# match = ["steam_app_", ".exe"]
#
# [[layout.strip]]
# type = "apps"
# label = "VoIP"
# match = ["mumble"]
#
# [[layout.strip]]
# type = "inherit"                    # strip 3 of the default layout
#
# [[layout.strip]]
# type = "voip"                       # always Bob (his name in the voice chat), dark while he is away
# person = "Bob"
#
# [[layout.strip]]                    # strips 5 to 8: the group, everybody else in the voice chat;
# type = "voip"                       # Select on one of them shows the next ones
# [[layout.strip]]
# type = "voip"
# [[layout.strip]]
# type = "voip"
# [[layout.strip]]
# type = "voip"
